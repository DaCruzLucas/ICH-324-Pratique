name: Build
 
on:
  push:
    branches: [ main ]
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Installation des dépendances
        run: npm ci
      - name: Exécution des tests
        run: npm test
      - name: Création de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            index.js
            package.json
            junit.xml
